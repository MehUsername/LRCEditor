<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="stylesheets/style.css">
    <link rel="stylesheet" href="stylesheets/theme.css">
    <link rel="stylesheet" href="stylesheets/errWindow.css">
    <!-- <link rel="manifest" href="manifest.json"> -->
    <link rel="icon" href="imgs/icon192x192.png">
    <title>LRC File Editor</title>
</head>

<template id="clone">
    <div class="lyricFrame">
        <div class="timestamp">[00:00.00]</div>
        <div class="lyricText">-</div>
    </div>
</template>

<body>
    <div id="pageTitle">
        <div id="themeButtonCont">
            <input id="themeButton" type="checkbox" onclick="toggleTheme(this)" style="display:none;">
            <label id="themeToggle" for="themeButton" tabindex="-1">
                <img src="imgs/sunrays.png" id="sunrays">
            </label>
        </div>
        <div id="titleCont">
            <h4>mehusername's</h4>
            <h3>LRC File Editor</h3>
        </div>
    </div>

    <div id="description">
        All uploaded files are handled locally, meaning it is only kept in your device.<br>No files are uploaded to any
        server or cloud storage.
    </div>

    <dialog id="errDialog">
        <div id="errWindow">
            <div id="errTitle">Window Title</div>
            <div id="errDesc">Error Description</div>
            <div style="display: flex; justify-content:center; align-items: center;">
                <button class="controls" id="cancel" tabindex="-1"><i class="fa-solid fa-xmark"></i> Hell nah</button>
                <button class="controls" id="confirm" tabindex="-1"><i class="fa-solid fa-check"></i> Yeah, okay</button>
            </div>
        </div>
    </dialog>

    <div id="info">
        <div class="fileInput" style="justify-content:center;">
            <label for="lrc" class="customLabel"><i class="fa-solid fa-arrow-up-from-bracket"></i> Upload LRC / Text
                File<br><span style="font-size: 0.85em;">(.lrc, .txt)</span></label>
            <input type="file" id="lrc" accept=".lrc,.txt"  tab-index="0" role="button">
        </div>

        <hr style="border-top: 1px solid;padding:0;width:90%">

        <form id="fileMetadata">
            <div>
                <div>Title:</div><input id="title" type="text">
            </div>
            <div>
                <div>Album:</div><input id="album" type="text">
            </div>
            <div>
                <div>Artist:</div><input id="artist" type="text">
            </div>
            <div>
                <div>Author:</div><input id="author" type="text">
            </div>
            <div>
                <div>File Author:</div><input id="by" type="text">
            </div>
        </form>

        <textarea id="lyrics" placeholder="Enter lyrics here..."></textarea>
        <div id="dataControls">
            <button onclick="clearTimestamps()">Clear timestamps</button>
            <button onclick="clearMetadata()">Clear metadata</button>
        </div>

        <div class="fileInput">
            <label for="music" class="customLabel"><i class="fa-solid fa-arrow-up-from-bracket"></i> Upload
                Music</label>
            <div id="musicSelected"></div>
            <input type="file" id="music" name="music" accept="audio/*">
        </div>

        <button onclick="generateLyrics()" id="createFile">Create File</button>
    </div>

    <div id="generate" style="display:none;">
        <audio id="audio" controls style="width:90%;">
            <source id="source">
            </source>
        </audio>
        <div id="lyricDiv"></div>
        <div id="lyricControls">
            <button id="nextLine" onclick="nextLine()"><i class="fa-solid fa-forward-step"></i><br>Next Line</button>
            <div id="offsetControls">
                <div>
                    <button onclick="changeOffset(-100)">-</button>
                    <input id="offset" placeholder="Offset" size="5%" value="0" style="text-align: center;">
                    <button onclick="changeOffset(100)">+</button>
                </div>
                <div>
                    <button onclick="applyOffset(true)">Apply Offset to All Lines</button>
                    <button onclick="applyOffset(false)">Apply Offset on Current Line</button>
                </div>
            </div>
            <button id="clearTimes" onclick="clearTimes()"><i class="fa-solid fa-trash"></i><br>Clear Times</button>
        </div>
        <button id="finishFile" onclick="finishFile()"><i class="fa-solid fa-file-export"></i> Finish and Download
            File</button>
        <div id="errorMessage"></div>

        <form id="fileControls">
            <h2><i class="fa-solid fa-gear"></i> File Controls</h2>
            <div class="fileControl">
                <input type="checkbox" id="applyMeta" checked></input>
                <label for="applyMeta">
                    Apply Headers/Metadata<br><span>Disable when a program cannot detect the LRC file. (ex:
                        Poweramp)</span>
                </label>
            </div>
            <div class="fileControl">
                <input type="checkbox" id="askSave" checked></input>
                <label for="askSave">
                    Ask where to save<br><span>Ask where to save the file. Fallbacks to default location if it
                        fails.</span>
                </label>
            </div>
        </form>
    </div>
    <script src="https://kit.fontawesome.com/2cb454bafe.js" crossorigin="anonymous"></script>
    <script type="text/javascript" src="errHandler.js" defer></script>
    <script type="text/javascript" src="script.js" defer></script>
</body>

</html>
